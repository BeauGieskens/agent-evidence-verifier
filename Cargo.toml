[package]
name = "agent-evidence-verifier"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "src/lib/lib.rs"

[dependencies.base64]
version = "0.22"

[dependencies.bytes]
version = "1"
features = ["serde"]

[dependencies.ciborium]
version = "0.2"

[dependencies.clap]
version = "4"
features = ["derive"]

[dependencies.cose-rust]
version = "0.1"

[dependencies.ed25519-dalek]
version = "2"
default-features = false
features = ["std"]

[dependencies.hex]
version = "0.4"

[dependencies.jiff]
version = "0.2"
features = ["serde"]

[dependencies.nonempty]
version = "0.12"
features = ["serialize"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1"
features = ["arbitrary_precision", "raw_value"]

[dependencies.serde_jcs]
version = "0.2"

[dependencies.serde_tuple]
version = "1"

[dependencies.serde_with]
version = "3"

[dependencies.sha2]
version = "0.11"
